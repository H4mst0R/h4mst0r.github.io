<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebenslinie</title>
<style>
  :root{
    --bg: #1D1D20;
    --bg-header: #19191B;
    --panel: #27272B;
    --panel-hover: #303035;
    --ink: #E6E6E9;
    --ink-dim: #9B9BA3;
    --ink-faint: #6C6C74;
    --border: #38383D;
    --border-strong: #48484F;
    --line: #414146;
    --focus: #9A9AA2;
    --ink-hover: #FFFFFF;
  }

  *{ box-sizing:border-box; }

  html{ color-scheme: dark; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:14px;
    line-height:1.5;
    padding-bottom:80px;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{ margin:0; font-weight:600; }

  .icon{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg-header);
    padding:18px 24px;
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1100px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .title-block h1{ font-size:18px; font-weight:600; color:var(--ink); }
  .title-block p{ margin:2px 0 0; color:var(--ink-dim); font-size:12.5px; }

  .header-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .header-meta{ display:flex; align-items:center; gap:10px; flex-wrap:nowrap; }
  .header-actions{ display:flex; align-items:center; gap:14px; flex-wrap:nowrap; }
  .field{ display:flex; align-items:center; gap:8px; }
  .field label{ font-size:12.5px; color:var(--ink-dim); white-space:nowrap; }
  .field input[type=date]{
    background:var(--panel); border:1px solid var(--border); color:var(--ink);
    padding:6px 8px; border-radius:5px; font-family:inherit; font-size:13px;
  }
  .age-readout{ font-size:13px; color:var(--ink-dim); white-space:nowrap; }
  .age-readout strong{ color:var(--ink); font-weight:600; }

  .icon-btn{
    width:32px; height:32px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel); color:var(--ink-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover{ background:var(--panel-hover); color:var(--ink); border-color:var(--border-strong); }
  .icon-btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .icon-btn.primary:hover{ background:var(--ink-hover); border-color:var(--ink-hover); }
  .icon-btn.danger{ color:#C77E76; }
  .icon-btn.danger:hover{ background:rgba(179,38,30,0.16); color:#E2948B; border-color:#8C4038; }

  .icon-divider{ width:1px; height:20px; background:var(--border); }

  #importFile{ display:none; }

  /* ---------- Timeline ---------- */
  main{ max-width:1100px; margin:0 auto; padding:16px 24px 0; }

  .empty-state{
    margin-top:60px; text-align:center; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .empty-state h2{ color:var(--ink); font-size:16px; font-weight:600; }
  .empty-state p{ font-size:13px; margin:0; }

  .timeline{ position:relative; }
  .timeline::before{
    content:'';
    position:absolute; top:0; bottom:0; left:50%;
    transform:translateX(-50%);
    width:1px;
    background:linear-gradient(180deg, transparent, var(--line) 3%, var(--line) 97%, transparent);
  }

  .year-row{ display:flex; align-items:flex-start; gap:16px; padding:8px 0; }
  .col-side{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .col-left{ align-items:flex-end; }
  .col-right{ align-items:flex-start; }

  .col-center{ flex:0 0 96px; width:96px; display:flex; justify-content:center; position:relative; z-index:2; }

  .lane{ flex:0 0 auto; position:relative; align-self:stretch; }

  .span-bar{
    position:absolute; z-index:1;
    border-radius:6px; cursor:pointer;
    box-shadow:0 0 0 1px rgba(0,0,0,0.1) inset;
    transition:filter .12s, z-index .01s;
  }
  .span-bar:hover{ filter:brightness(0.95); z-index:40; }
  .span-bar-label{
    width:100%; height:100%; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:10.5px; font-weight:600; line-height:1.2;
    padding:8px 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .span-bar-popover{
    position:absolute; top:50%; width:220px; max-width:60vw;
    box-sizing:border-box;
    writing-mode:horizontal-tb; text-orientation:initial;
    border-radius:8px; padding:10px 12px;
    font-size:12px; line-height:1.4;
    box-shadow:0 10px 28px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transform:translateY(-50%) scale(0.96);
    transform-origin:center;
    transition:opacity .12s, transform .12s;
    z-index:60;
  }
  .span-bar:hover .span-bar-popover{ opacity:1; pointer-events:auto; transform:translateY(-50%) scale(1); }
  .span-bar-left .span-bar-popover{ right:100%; margin-right:8px; }
  .span-bar-right .span-bar-popover{ left:100%; margin-left:8px; }
  .span-bar-popover .popover-title{ margin:0 0 4px; font-weight:700; }
  .span-bar-popover .popover-text{ margin:0; opacity:0.9; white-space:pre-wrap; }
  .span-bar-popover .popover-range{ margin:6px 0 0; font-size:10.5px; opacity:0.7; }

  .year-marker{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:42px; height:42px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border-strong);
    color:var(--ink-dim); cursor:pointer; user-select:none;
    transition:border-color .12s, color .12s, background .12s;
  }
  .year-marker:hover{ border-color:var(--ink); color:var(--ink); background:var(--panel); }
  .year-marker .age{ font-size:13px; font-weight:600; line-height:1; color:inherit; }
  .year-marker .cal{ font-size:8.5px; margin-top:1px; color:var(--ink-faint); }
  .year-marker.has-entries{ border-color:var(--ink-dim); }

  .entry-card{
    max-width:320px; width:100%;
    border-radius:6px; padding:8px 10px;
    cursor:pointer; position:relative;
    border:1px solid rgba(0,0,0,0.08);
    transition:filter .12s;
  }
  .entry-card:hover{ filter:brightness(0.97); }
  .entry-card .entry-title{
    font-weight:600; font-size:13px; margin:0 0 2px; padding-right:20px;
  }
  .entry-card .entry-text{
    font-size:12px; opacity:0.85; margin:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .entry-card .entry-delete{
    position:absolute; top:6px; right:6px;
    width:20px; height:20px; border-radius:4px; border:none;
    background:rgba(0,0,0,0.08); color:inherit; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0.6;
  }
  .entry-card .entry-delete:hover{ opacity:1; background:rgba(0,0,0,0.16); }
  .entry-card .entry-delete .icon{ width:12px; height:12px; }
  .col-left .entry-card{ text-align:right; }
  .col-left .entry-card .entry-delete{ left:6px; right:auto; }
  .col-left .entry-card .entry-title{ padding-right:0; padding-left:20px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    width:100%; max-width:420px; padding:22px;
    box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .modal h2{ font-size:15px; font-weight:600; margin-bottom:16px; }
  .modal .field-block{ margin-bottom:13px; width:100%; }
  .modal label{ font-size:12px; color:var(--ink-dim); margin-bottom:5px; display:block; }
  .modal input[type=text], .modal select, .modal textarea{
    width:100%; background:var(--bg); border:1px solid var(--border);
    color:var(--ink); padding:8px 9px; border-radius:5px; font-family:inherit; font-size:13.5px;
  }
  .modal input[type=text]:focus, .modal select:focus, .modal textarea:focus{
    outline:none; border-color:var(--focus);
  }
  .modal textarea{ resize:vertical; min-height:70px; }

  .side-toggle{ display:flex; gap:8px; }
  .side-toggle button{
    flex:1; padding:8px; border-radius:5px; border:1px solid var(--border);
    background:var(--bg); color:var(--ink-dim); cursor:pointer; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .side-toggle button .icon{ width:13px; height:13px; }
  .side-toggle button.active[data-side="neg"]{ background:#B3261E; border-color:#B3261E; color:#FBF6EC; }
  .side-toggle button.active[data-side="pos"]{ background:#2E7D32; border-color:#2E7D32; color:#FBF6EC; }

  .intensity-row{ display:flex; gap:6px; }
  .intensity-row button{
    flex:1; height:32px; border-radius:5px; border:1px solid var(--border);
    cursor:pointer; color:var(--ink-dim); background:var(--bg); font-weight:600; font-size:12.5px;
  }
  .intensity-row button.selected{ outline:2px solid var(--ink); outline-offset:1px; }

  .modal-actions{ display:flex; justify-content:flex-end; align-items:center; margin-top:18px; gap:10px; }
  .modal-actions .right-actions{ display:flex; gap:8px; }
  .modal-actions #deleteFromFormBtn{ margin-right:auto; }
  .text-btn{
    font-family:inherit; width:36px; height:36px; padding:0;
    border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .text-btn:hover{ background:var(--panel-hover); }
  .text-btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .text-btn.primary:hover{ background:var(--ink-hover); border-color:var(--ink-hover); }
  .text-btn.danger{ background:transparent; border-color:#D9B4B0; color:#B3261E; }
  .text-btn.danger:hover{ background:rgba(179,38,30,0.06); }

  .confirm-modal .modal{ max-width:340px; text-align:center; }
  .confirm-modal p{ color:var(--ink-dim); margin:0 0 18px; font-size:13px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }

  @media (max-width: 680px){
    header{ padding:14px 16px; }
    main{ padding:12px 12px 0; }
    .year-row{ gap:8px; }
    .col-center{ flex-basis:64px; width:64px; }
    .year-marker{ width:36px; height:36px; }
    .year-marker .age{ font-size:11.5px; }
    .entry-card{ max-width:none; }
    .header-controls{ width:100%; justify-content:space-between; }
    .span-bar{ font-size:9px; }
  }

  /* ---------- Print ---------- */
  .print-only{ display:none; }

  @media print{
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }

    body{ background:#fff !important; color:#111 !important; padding-bottom:0; }

    header{ position:static; background:#fff !important; border-bottom:1px solid #ccc; padding:0 0 12px; }
    .header-controls, .empty-state{ display:none !important; }
    .title-block p{ color:#555 !important; }

    .print-only{ display:block; font-size:12px; color:#555; margin:6px 0 0; }

    main{ padding:16px 0 0; max-width:none; }

    .timeline::before{ background:#bbb !important; }

    .year-marker{ background:#fff !important; border-color:#999 !important; color:#333 !important; }
    .year-marker .cal{ color:#888 !important; }

    .entry-card{ border:1px solid rgba(0,0,0,0.15) !important; box-shadow:none !important; break-inside:avoid; }
    .entry-card .entry-delete{ display:none !important; }
    .span-bar{ box-shadow:0 0 0 1px rgba(0,0,0,0.2) inset !important; }
    .span-bar-popover{ display:none !important; }

    .year-row{ break-inside:avoid; }

    .modal-overlay{ display:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-block">
      <h1>Lebenslinie</h1>
      <p>Zeitstrahl prägender Momente</p>
    </div>
    <div class="header-controls">
      <div class="header-meta">
        <div class="field">
          <label for="birthdate">Geburtsdatum</label>
          <input type="date" id="birthdate">
        </div>
        <div class="age-readout" id="ageReadout">–</div>
      </div>
      <div class="header-actions">
        <div class="icon-divider"></div>
        <button class="icon-btn primary" id="addBtn" title="Eintrag hinzufügen">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="exportBtn" title="Als .json exportieren">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" id="importBtn" title="Aus .json importieren">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="icon-btn" id="printBtn" title="Drucken">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <div class="icon-divider"></div>
        <button class="icon-btn danger" id="clearAllBtn" title="Alle Einträge löschen">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <input type="file" id="importFile" accept="application/json">
      </div>
    </div>
  </div>
  <p class="print-only" id="printMeta"></p>
</header>

<main>
  <div id="emptyState" class="empty-state" style="display:none;">
    <h2>Kein Geburtsdatum gesetzt</h2>
    <p>Geburtsdatum wählen, um zu starten.</p>
  </div>
  <div class="timeline" id="timeline"></div>
</main>

<!-- Entry Form Modal -->
<div class="modal-overlay hidden" id="entryModalOverlay">
  <div class="modal">
    <h2 id="entryModalTitle">Eintrag hinzufügen</h2>
    <div class="field-block">
      <label for="entryYear">Von</label>
      <select id="entryYear"></select>
    </div>
    <div class="field-block">
      <label for="entryYearEnd">Bis</label>
      <select id="entryYearEnd"></select>
    </div>
    <div class="field-block">
      <label for="entryTitle">Titel</label>
      <input type="text" id="entryTitle" placeholder="Was?" maxlength="80">
    </div>
    <div class="field-block">
      <label for="entryText">Beschreibung</label>
      <textarea id="entryText" placeholder="Wieso? Weshalb? Warum?"></textarea>
    </div>
    <div class="field-block">
      <label>Gewichtung</label>
      <div class="side-toggle" id="sideToggle">
        <button type="button" data-side="neg">
          <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          negativ
        </button>
        <button type="button" data-side="pos">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          positiv
        </button>
      </div>
    </div>
    <div class="field-block">
      <label>Stärke</label>
      <div class="intensity-row" id="intensityRow"></div>
    </div>
    <div class="modal-actions">
      <button class="text-btn danger" id="deleteFromFormBtn" title="Löschen" style="display:none;">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
      <div class="right-actions">
        <button class="text-btn" id="cancelEntryBtn" title="Abbrechen">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button class="text-btn primary" id="saveEntryBtn" title="Speichern">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay hidden confirm-modal" id="confirmModalOverlay">
  <div class="modal">
    <h2 id="confirmTitle">Eintrag wirklich löschen?</h2>
    <p id="confirmText">Dieser Schritt lässt sich nicht rückgängig machen.</p>
    <div class="confirm-actions">
      <button class="text-btn" id="confirmCancelBtn" title="Abbrechen">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="text-btn danger" id="confirmOkBtn" title="Löschen bestätigen">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const LS_BIRTHDATE = 'lebenslinie_birthdate';
  const LS_ENTRIES = 'lebenslinie_entries';

  let birthdate = localStorage.getItem(LS_BIRTHDATE) || '';
  let entries = [];
  try { entries = JSON.parse(localStorage.getItem(LS_ENTRIES)) || []; } catch(e){ entries = []; }

  let formState = { mode:'add', id:null, side:'pos', intensity:3, year:0 };

  const $ = (sel) => document.querySelector(sel);
  const birthdateInput = $('#birthdate');
  const ageReadout = $('#ageReadout');
  const timelineEl = $('#timeline');
  const emptyState = $('#emptyState');
  const printMeta = $('#printMeta');

  birthdateInput.value = birthdate;

  function saveEntries(){ localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); }
  function saveBirthdate(){ localStorage.setItem(LS_BIRTHDATE, birthdate); }

  function uid(){ return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  function completedYears(birth){
    const b = new Date(birth + 'T00:00:00');
    const now = new Date();
    let years = now.getFullYear() - b.getFullYear();
    const hadBirthdayThisYear =
      (now.getMonth() > b.getMonth()) ||
      (now.getMonth() === b.getMonth() && now.getDate() >= b.getDate());
    if (!hadBirthdayThisYear) years -= 1;
    return Math.max(0, years);
  }

  function weightColor(weight){
    const abs = Math.abs(weight);
    const negStops = ['#F7DAD6','#EFBBB4','#E2948B','#CD6257','#B3261E'];
    const posStops = ['#DCEBD8','#BEDCB6','#98C88E','#69AC5C','#2E7D32'];
    const stops = weight < 0 ? negStops : posStops;
    return stops[Math.min(abs,5) - 1];
  }
  function weightTextColor(weight){
    return Math.abs(weight) >= 4 ? '#FBF6EC' : '#241B10';
  }

  // ---------- Rendering ----------

  function assignTracks(list){
    const sorted = list.slice().sort((a,b) => a.year - b.year);
    const trackEnds = [];
    const trackOf = {};
    sorted.forEach(e => {
      let track = trackEnds.findIndex(end => end < e.year);
      if (track === -1){ track = trackEnds.length; trackEnds.push(e.yearEnd); }
      else { trackEnds[track] = e.yearEnd; }
      trackOf[e.id] = track;
    });
    return { trackOf, trackCount: trackEnds.length };
  }

  const BAR_WIDTH = 12;
  const BAR_GAP = 4;

  function render(){
    if (!birthdate){
      emptyState.style.display = 'flex';
      timelineEl.style.display = 'none';
      ageReadout.textContent = '–';
      printMeta.textContent = '';
      return;
    }
    emptyState.style.display = 'none';
    timelineEl.style.display = 'block';

    const b = new Date(birthdate + 'T00:00:00');
    const birthYear = b.getFullYear();
    const maxAge = completedYears(birthdate);
    ageReadout.innerHTML = '<strong>' + maxAge + '</strong> vollendete Lebensjahre';
    const bdFormatted = b.toLocaleDateString('de-DE');
    printMeta.textContent = 'Geburtsdatum: ' + bdFormatted + ' · ' + maxAge + ' vollendete Lebensjahre';

    timelineEl.innerHTML = '';

    const normalized = entries.map(e => ({ ...e, yearEnd: (e.yearEnd != null ? e.yearEnd : e.year) }));
    const singleEntries = normalized.filter(e => e.yearEnd === e.year);
    const multiEntries = normalized.filter(e => e.yearEnd !== e.year);
    const multiLeft = multiEntries.filter(e => e.weight < 0);
    const multiRight = multiEntries.filter(e => e.weight > 0);
    const tracksLeft = assignTracks(multiLeft);
    const tracksRight = assignTracks(multiRight);
    const laneWidth = (trackCount) => trackCount ? 8 + trackCount * (BAR_WIDTH + BAR_GAP) : 8;
    const laneWidthLeft = laneWidth(tracksLeft.trackCount);
    const laneWidthRight = laneWidth(tracksRight.trackCount);

    const coveredAges = new Set();
    multiEntries.forEach(e => { for (let a = e.year; a <= e.yearEnd; a++) coveredAges.add(a); });

    const laneLeftEls = {};
    const laneRightEls = {};

    for (let age = 0; age <= maxAge; age++){
      const row = document.createElement('div');
      row.className = 'year-row';

      const colLeft = document.createElement('div');
      colLeft.className = 'col-side col-left';
      const colRight = document.createElement('div');
      colRight.className = 'col-side col-right';
      const colCenter = document.createElement('div');
      colCenter.className = 'col-center';
      const laneLeft = document.createElement('div');
      laneLeft.className = 'lane';
      laneLeft.style.width = laneWidthLeft + 'px';
      const laneRight = document.createElement('div');
      laneRight.className = 'lane';
      laneRight.style.width = laneWidthRight + 'px';

      const yearEntries = singleEntries.filter(e => e.year === age);
      yearEntries.filter(e => e.weight < 0).sort((a,b2)=>a.weight-b2.weight)
        .forEach(e => colLeft.appendChild(buildEntryCard(e)));
      yearEntries.filter(e => e.weight > 0).sort((a,b2)=>b2.weight-a.weight)
        .forEach(e => colRight.appendChild(buildEntryCard(e)));

      const marker = document.createElement('div');
      marker.className = 'year-marker' + ((yearEntries.length || coveredAges.has(age)) ? ' has-entries' : '');
      marker.title = 'Eintrag für Alter ' + age + ' hinzufügen';
      marker.innerHTML = '<div class="age">' + age + '</div><div class="cal">' + (birthYear + age) + '</div>';
      marker.addEventListener('click', () => openEntryModal('add', { year: age, yearEnd: age }));
      colCenter.appendChild(marker);

      row.appendChild(colLeft);
      row.appendChild(laneLeft);
      row.appendChild(colCenter);
      row.appendChild(laneRight);
      row.appendChild(colRight);
      timelineEl.appendChild(row);

      laneLeftEls[age] = laneLeft;
      laneRightEls[age] = laneRight;
    }

    function placeBars(list, tracks, laneEls, side){
      list.forEach(e => {
        const startLane = laneEls[e.year];
        const endLane = laneEls[e.yearEnd];
        if (!startLane || !endLane) return;
        const top = startLane.offsetTop;
        const height = (endLane.offsetTop + endLane.offsetHeight) - top;
        const track = tracks.trackOf[e.id] || 0;
        const left = startLane.offsetLeft + 4 + track * (BAR_WIDTH + BAR_GAP);

        const bar = document.createElement('div');
        bar.className = 'span-bar ' + (side === 'left' ? 'span-bar-left' : 'span-bar-right');
        bar.style.top = top + 'px';
        bar.style.height = Math.max(height, BAR_WIDTH) + 'px';
        bar.style.left = left + 'px';
        bar.style.width = BAR_WIDTH + 'px';
        bar.style.background = weightColor(e.weight);
        bar.style.color = weightTextColor(e.weight);
        bar.addEventListener('click', () => openEntryModal('edit', e));

        const label = document.createElement('div');
        label.className = 'span-bar-label';
        label.textContent = e.title;
        bar.appendChild(label);

        const popover = document.createElement('div');
        popover.className = 'span-bar-popover';
        popover.style.background = weightColor(e.weight);
        popover.style.color = weightTextColor(e.weight);

        const pTitle = document.createElement('p');
        pTitle.className = 'popover-title';
        pTitle.textContent = e.title;
        popover.appendChild(pTitle);

        if (e.text){
          const pText = document.createElement('p');
          pText.className = 'popover-text';
          pText.textContent = e.text;
          popover.appendChild(pText);
        }

        const pRange = document.createElement('p');
        pRange.className = 'popover-range';
        pRange.textContent = 'Alter ' + e.year + '–' + e.yearEnd;
        popover.appendChild(pRange);

        bar.appendChild(popover);
        timelineEl.appendChild(bar);
      });
    }
    placeBars(multiLeft, tracksLeft, laneLeftEls, 'left');
    placeBars(multiRight, tracksRight, laneRightEls, 'right');
  }

  function buildEntryCard(entry){
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.title = 'Klicken zum Bearbeiten';
    card.style.background = weightColor(entry.weight);
    card.style.color = weightTextColor(entry.weight);

    const title = document.createElement('p');
    title.className = 'entry-title';
    title.textContent = entry.title;

    const text = document.createElement('p');
    text.className = 'entry-text';
    text.textContent = entry.text || '';

    const delBtn = document.createElement('button');
    delBtn.className = 'entry-delete';
    delBtn.title = 'Eintrag löschen';
    delBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
    delBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      openConfirmDelete(entry.id);
    });

    card.appendChild(delBtn);
    card.appendChild(title);
    card.appendChild(text);

    card.addEventListener('click', () => openEntryModal('edit', entry));
    return card;
  }

  // ---------- Entry Modal ----------

  const entryModalOverlay = $('#entryModalOverlay');
  const entryModalTitle = $('#entryModalTitle');
  const entryYearSelect = $('#entryYear');
  const entryYearEndSelect = $('#entryYearEnd');
  const entryTitleInput = $('#entryTitle');
  const entryTextInput = $('#entryText');
  const sideToggle = $('#sideToggle');
  const intensityRow = $('#intensityRow');
  const deleteFromFormBtn = $('#deleteFromFormBtn');

  function buildIntensityButtons(){
    intensityRow.innerHTML = '';
    for (let i = 1; i <= 5; i++){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = i;
      btn.dataset.intensity = i;
      btn.addEventListener('click', () => {
        formState.intensity = i;
        refreshIntensityStyles();
      });
      intensityRow.appendChild(btn);
    }
  }
  buildIntensityButtons();

  function refreshIntensityStyles(){
    Array.from(intensityRow.children).forEach(btn => {
      const i = parseInt(btn.dataset.intensity, 10);
      const signedWeight = formState.side === 'neg' ? -i : i;
      btn.style.background = weightColor(signedWeight);
      btn.style.color = weightTextColor(signedWeight);
      btn.classList.toggle('selected', i === formState.intensity);
    });
  }

  sideToggle.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-side]');
    if (!btn) return;
    formState.side = btn.dataset.side;
    Array.from(sideToggle.children).forEach(b => b.classList.toggle('active', b === btn));
    refreshIntensityStyles();
  });

  function populateYearSelect(selectEl, selectedAge){
    const maxAge = completedYears(birthdate);
    const birthYear = new Date(birthdate + 'T00:00:00').getFullYear();
    selectEl.innerHTML = '';
    for (let age = 0; age <= maxAge; age++){
      const opt = document.createElement('option');
      opt.value = age;
      opt.textContent = age + ' Jahre (' + (birthYear + age) + ')';
      if (age === selectedAge) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  function openEntryModal(mode, data){
    formState.mode = mode;
    formState.id = data.id || null;
    formState.year = data.year;
    formState.side = (data.weight || 1) < 0 ? 'neg' : 'pos';
    formState.intensity = Math.abs(data.weight || 3) || 3;

    entryModalTitle.textContent = mode === 'add' ? 'Eintrag hinzufügen' : 'Eintrag bearbeiten';
    populateYearSelect(entryYearSelect, data.year);
    populateYearSelect(entryYearEndSelect, data.yearEnd != null ? data.yearEnd : data.year);
    entryTitleInput.value = data.title || '';
    entryTextInput.value = data.text || '';

    Array.from(sideToggle.children).forEach(b => b.classList.toggle('active', b.dataset.side === formState.side));
    refreshIntensityStyles();

    deleteFromFormBtn.style.display = mode === 'edit' ? 'flex' : 'none';

    entryModalOverlay.classList.remove('hidden');
    entryTitleInput.focus();
  }

  function closeEntryModal(){
    entryModalOverlay.classList.add('hidden');
  }

  $('#cancelEntryBtn').addEventListener('click', closeEntryModal);
  entryModalOverlay.addEventListener('click', (ev) => {
    if (ev.target === entryModalOverlay) closeEntryModal();
  });

  $('#saveEntryBtn').addEventListener('click', () => {
    const title = entryTitleInput.value.trim();
    if (!title){
      entryTitleInput.focus();
      entryTitleInput.style.borderColor = '#B3261E';
      return;
    }
    let year = parseInt(entryYearSelect.value, 10);
    let yearEnd = parseInt(entryYearEndSelect.value, 10);
    if (yearEnd < year){ const tmp = year; year = yearEnd; yearEnd = tmp; }
    const weight = formState.side === 'neg' ? -formState.intensity : formState.intensity;
    const text = entryTextInput.value.trim();

    if (formState.mode === 'add'){
      entries.push({ id: uid(), year, yearEnd, weight, title, text });
    } else {
      const entry = entries.find(e => e.id === formState.id);
      if (entry){
        entry.year = year;
        entry.yearEnd = yearEnd;
        entry.weight = weight;
        entry.title = title;
        entry.text = text;
      }
    }
    saveEntries();
    closeEntryModal();
    render();
  });

  deleteFromFormBtn.addEventListener('click', () => {
    openConfirmDelete(formState.id, closeEntryModal);
  });

  // ---------- Add button (header) ----------

  $('#addBtn').addEventListener('click', () => {
    if (!birthdate){
      birthdateInput.focus();
      return;
    }
    const maxAge = completedYears(birthdate);
    openEntryModal('add', { year: maxAge, yearEnd: maxAge });
  });

  // ---------- Confirm Delete Modal ----------

  const confirmModalOverlay = $('#confirmModalOverlay');
  const confirmTitleEl = $('#confirmTitle');
  const confirmTextEl = $('#confirmText');
  let pendingDeleteId = null;
  let pendingDeleteAfter = null;
  let pendingAction = 'single';

  function openConfirmDelete(id, afterCloseCb){
    pendingAction = 'single';
    pendingDeleteId = id;
    pendingDeleteAfter = afterCloseCb || null;
    confirmTitleEl.textContent = 'Eintrag wirklich löschen?';
    confirmTextEl.textContent = 'Dieser Schritt lässt sich nicht rückgängig machen.';
    confirmModalOverlay.classList.remove('hidden');
  }
  function openConfirmDeleteAll(){
    pendingAction = 'all';
    pendingDeleteId = null;
    pendingDeleteAfter = null;
    confirmTitleEl.textContent = 'Wirklich alle Einträge löschen?';
    confirmTextEl.textContent = 'Alle ' + entries.length + ' Einträge werden entfernt. Dieser Schritt lässt sich nicht rückgängig machen.';
    confirmModalOverlay.classList.remove('hidden');
  }
  function closeConfirmDelete(){
    confirmModalOverlay.classList.add('hidden');
    pendingDeleteId = null;
    pendingDeleteAfter = null;
    pendingAction = 'single';
  }

  $('#confirmCancelBtn').addEventListener('click', closeConfirmDelete);
  confirmModalOverlay.addEventListener('click', (ev) => {
    if (ev.target === confirmModalOverlay) closeConfirmDelete();
  });
  $('#confirmOkBtn').addEventListener('click', () => {
    if (pendingAction === 'all'){
      entries = [];
    } else {
      entries = entries.filter(e => e.id !== pendingDeleteId);
    }
    saveEntries();
    const cb = pendingDeleteAfter;
    closeConfirmDelete();
    if (cb) cb();
    render();
  });

  // ---------- Alles löschen ----------

  $('#clearAllBtn').addEventListener('click', () => {
    if (!entries.length) return;
    openConfirmDeleteAll();
  });

  // ---------- Drucken ----------

  $('#printBtn').addEventListener('click', () => {
    window.print();
  });

  // ---------- Birthdate ----------

  birthdateInput.addEventListener('change', () => {
    birthdate = birthdateInput.value;
    saveBirthdate();
    render();
  });

  // ---------- Import / Export ----------

  $('#exportBtn').addEventListener('click', () => {
    const payload = { birthdate, entries };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lebenslinie-export.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  const importBtn = $('#importBtn');
  const importFile = $('#importFile');
  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.entries)){
          alert('Diese Datei enthält keine gültigen Lebenslinie-Daten.');
          return;
        }
        const ok = confirm('Import ersetzt alle aktuell gespeicherten Daten. Fortfahren?');
        if (!ok) return;
        birthdate = data.birthdate || '';
        entries = data.entries.map(e => ({
          id: e.id || uid(),
          year: e.year,
          yearEnd: (e.yearEnd != null ? e.yearEnd : e.year),
          weight: e.weight,
          title: e.title || '',
          text: e.text || ''
        }));
        birthdateInput.value = birthdate;
        saveBirthdate();
        saveEntries();
        render();
      } catch(err){
        alert('Die Datei konnte nicht gelesen werden: ' + err.message);
      } finally {
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  // ---------- Init ----------
  render();

})();
</script>
</body>
</html>
